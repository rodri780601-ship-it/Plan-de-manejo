<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario PMFBN - Nueva Solicitud 2020</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container" id="formToPrint">
        <header class="form-header">
            <div class="logo-area">
                <h2>FORMULARIO DE NUEVA SOLICITUD</h2>
                <p>Programa de Modernización y Fortalecimiento (PMFBN)</p>
            </div>
            <div class="meta-area">
                <span class="badge">AÑO 2020</span>
            </div>
        </header>

        <form id="formularioPMFBN">
            <!-- Sección 1: Datos de la Institución / Solicitante -->
            <fieldset class="form-section">
                <legend>1. Antecedentes del Solicitante e Institución</legend>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="institucion">Nombre de la Institución / Organización:</label>
                        <input type="text" id="institucion" name="institucion" placeholder="Ingrese nombre completo de la institución" required>
                    </div>
                    <div class="form-group">
                        <label for="rut_inst">RUT Institución:</label>
                        <input type="text" id="rut_inst" name="rut_inst" placeholder="XX.XXX.XXX-X" required>
                    </div>
                    <div class="form-group">
                        <label for="region">Región:</label>
                        <select id="region" name="region" required>
                            <option value="">Seleccione Región...</option>
                            <option value="Arica y Parinacota">Arica y Parinacota</option>
                            <option value="Tarapacá">Tarapacá</option>
                            <option value="Antofagasta">Antofagasta</option>
                            <option value="Atacama">Atacama</option>
                            <option value="Coquimbo">Coquimbo</option>
                            <option value="Valparaíso">Valparaíso</option>
                            <option value="Metropolitana">Metropolitana de Santiago</option>
                            <option value="O'Higgins">O'Higgins</option>
                            <option value="Maule">Maule</option>
                            <option value="Ñuble">Ñuble</option>
                            <option value="Biobío">Biobío</option>
                            <option value="La Araucanía">La Araucanía</option>
                            <option value="Los Ríos">Los Ríos</option>
                            <option value="Los Lagos">Los Lagos</option>
                            <option value="Aysén">Aysén</option>
                            <option value="Magallanes">Magallanes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="comuna">Comuna:</label>
                        <input type="text" id="comuna" name="comuna" placeholder="Ingrese comuna" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha_solicitud">Fecha de Solicitud:</label>
                        <input type="date" id="fecha_solicitud" name="fecha_solicitud" required>
                    </div>
                </div>
            </fieldset>

            <!-- Sección 2: Datos del Representante Legal -->
            <fieldset class="form-section">
                <legend>2. Datos del Representante Legal</legend>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="rep_nombre">Nombre Completo Representante Legal:</label>
                        <input type="text" id="rep_nombre" name="rep_nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="form-group">
                        <label for="rep_rut">RUT Representante:</label>
                        <input type="text" id="rep_rut" name="rep_rut" placeholder="XX.XXX.XXX-X" required>
                    </div>
                    <div class="form-group">
                        <label for="rep_cargo">Cargo:</label>
                        <input type="text" id="rep_cargo" name="rep_cargo" placeholder="Ej: Director, Presidente" required>
                    </div>
                    <div class="form-group">
                        <label for="rep_telefono">Teléfono de Contacto:</label>
                        <input type="tel" id="rep_telefono" name="rep_telefono" placeholder="+56 9 XXXX XXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="rep_email">Correo Electrónico:</label>
                        <input type="email" id="rep_email" name="rep_email" placeholder="correo@institucion.cl" required>
                    </div>
                </div>
            </fieldset>

            <!-- Sección 3: Detalle de la Solicitud del Proyecto -->
            <fieldset class="form-section">
                <legend>3. Identificación del Proyecto / Solicitud</legend>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="nombre_proyecto">Nombre del Proyecto / Iniciativa:</label>
                        <input type="text" id="nombre_proyecto" name="nombre_proyecto" placeholder="Ingrese nombre del proyecto" required>
                    </div>
                    <div class="form-group">
                        <label for="tipo_solicitud">Tipo de Solicitud:</label>
                        <select id="tipo_solicitud" name="tipo_solicitud" required>
                            <option value="">Seleccione Tipo...</option>
                            <option value="Inversión / Equipamiento">Inversión / Equipamiento</option>
                            <option value="Capacitación / Formación">Capacitación / Formación</option>
                            <option value="Infraestructura">Infraestructura</option>
                            <option value="Asistencia Técnica">Asistencia Técnica</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="monto_solicitado">Monto Solicitado ($ CLP):</label>
                        <input type="number" id="monto_solicitado" name="monto_solicitado" placeholder="Ej: 5000000" min="0" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="objetivo">Objetivo Principal de la Solicitud:</label>
                        <textarea id="objetivo" name="objetivo" rows="3" placeholder="Describa el objetivo principal del proyecto..." required></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label for="justificacion">Justificación y Beneficiarios:</label>
                        <textarea id="justificacion" name="justificacion" rows="4" placeholder="Describa la necesidad y la cantidad/perfil de beneficiarios estimados..." required></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- Botones de Acción (Ocultos al imprimir) -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="resetFormulario()">Limpiar Formulario</button>
                <button type="button" class="btn btn-primary" onclick="imprimirFormulario()">Completar y Guardar / Imprimir PDF</button>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
